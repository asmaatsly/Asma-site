const S=[
{id:'individual',g:'s',p:15,d:50,a:['جلسة دعم وإرشاد فردية','تساعدك على فهم ما تمرين به، ترتيب أفكارك ومشاعرك، وتحديد خيارات وخطوات عملية.','فهم المشكلة الحالية، ترتيب الأفكار، فهم المشاعر والاحتياجات، تحديد الخيارات، ووضع خطوات عملية.'],e:['Individual Support Session','A space to understand what you’re going through, sort your thoughts and feelings, and choose practical next steps.','Understanding the current situation, organizing your thoughts, making sense of feelings and needs, weighing options and setting practical steps.']},
{id:'teen',g:'s',p:12,d:45,a:['جلسات المراهقات','مساحة آمنة ومريحة للمراهقات للحديث عن المدرسة والصداقات والأسرة والمشاعر.','المدرسة، الصداقات، العلاقات، الأسرة، الحدود، الثقة بالنفس، الضغوط، المشاعر والتكيف.'],e:['Teen Support','A safe, comfortable space for teen girls to talk about school, friendships, family and feelings.','School, friendships, relationships, family, boundaries, self-confidence, pressure, feelings and adjusting to change.']},
{id:'attach',g:'s',p:15,d:50,a:['التعلّق والعلاقات','فهم أنماط التعلّق والاحتياجات العاطفية، وبناء علاقات أكثر وعيًا.','أنماط التعلّق، المحفزات، الحدود في العلاقات، العلاقات المرهقة، أنماط التواصل، والتعامل مع الانفصال والتغيرات العاطفية.'],e:['Attachment & Relationships','Understand attachment patterns and emotional needs, and build more conscious relationships.','Attachment patterns, triggers, boundaries in relationships, draining relationships, communication styles, and navigating breakups and emotional change.']},
{id:'emotion',g:'s',p:15,d:50,a:['تنظيم المشاعر والضغوط','أدوات عملية لفهم مشاعرك، تنظيم ردود فعلك، والتعامل مع الضغوط.','التعرف على المحفزات، التعامل مع الضيق والاندفاع، التوقف قبل اتخاذ القرار، وأدوات للمواقف الصعبة.'],e:['Emotional Regulation & Stress','Practical tools to understand your feelings, manage your reactions and handle pressure.','Recognizing triggers, coping with distress and impulsivity, pausing before decisions, and tools for hard moments.']},
{id:'family',g:'s',p:20,d:60,a:['الإرشاد الأسري والوالدي','دعم للأسرة والوالدين في التواصل والحدود وفهم احتياجات المراهقين.','التواصل داخل الأسرة، الخلافات، الحدود، التعامل مع سلوكيات الأبناء، وترتيب خطوات التعامل مع المشكلة الأسرية.'],e:['Family & Parent Guidance','Support for families and parents with communication, boundaries and understanding teens’ needs.','Communication within the family, disagreements, boundaries, responding to children’s behavior, and mapping out steps for a family challenge.']},
{id:'difficult',g:'s',p:15,d:50,a:['فهم أثر التجارب المؤلمة','جلسة داعمة لفهم أثر التجارب الصعبة السابقة على المشاعر والعلاقات والثقة.','أثرها على المشاعر والعلاقات والحدود والثقة والسلوك والحياة اليومية، وتنظيم الخطوات المناسبة، مع التوجيه لدعم متخصص إضافي عند الحاجة.'],e:['Understanding Difficult Experiences','A supportive session to understand how past difficult experiences can shape feelings, relationships and trust.','How difficult experiences may affect feelings, relationships, boundaries, trust, behavior and daily life; organizing suitable next steps and pointing to specialized support when needed.']},
{id:'follow',g:'s',p:10,d:30,a:['جلسة متابعة','جلسة قصيرة لمراجعة ما تم الاتفاق عليه أو التعامل مع نقطة محددة.','مراجعة الخطوات المتفق عليها، متابعة التقدم، أو التركيز على نقطة واحدة.'],e:['Follow-Up Session','A short session to review what you agreed on or work through one specific point.','Reviewing agreed steps, checking progress, or focusing on a single point.']},
{id:'candle',g:'c',p:12,d:'60–90',pp:1,a:['جلسة صناعة الشموع','تجربة عملية تصنعين فيها شمعتك بنفسك.','الخامات والأدوات والإرشاد أثناء التجربة.'],e:['Candle Making Experience','A hands-on experience where you make your own candle.','Materials, tools and guidance throughout the experience.']},
{id:'plaster',g:'c',p:10,d:'60–90',pp:1,a:['جلسة الجبس','تجربة فنية لصناعة أو تزيين قطعة جبسية.','صناعة أو تزيين قطعة جبسية بيديك.'],e:['Plaster Art Experience','An art experience for making or decorating a plaster piece.','Making or decorating a plaster piece with your own hands.']},
{id:'both',g:'c',p:18,d:'90–120',pp:1,a:['تجربة الشموع + الجبس','تجربة تجمع صناعة الشموع وفن الجبس في جلسة واحدة.','النشاطان معًا في جلسة إبداعية واحدة.'],e:['Candle & Plaster Creative Experience','One session that brings candle making and plaster art together.','Both activities in a single creative session.']},
{id:'workshop',g:'w',p:70,f:1,a:['ورشة أو برنامج لمؤسسة','ورش وبرامج تفاعلية للمدارس والجامعات والمؤسسات والمجموعات.','تواصلي للحصول على عرض مناسب حسب مدة البرنامج، عدد المشاركين وطبيعة الورشة.'],e:['Workshop or Program','Interactive workshops and programs for schools, universities, organizations and groups.','Contact for a tailored quotation based on duration, group size and program requirements.']}];

workshops:()=>{const u=[['المدارس','الجامعات','المراكز الشبابية','المؤسسات','الشركات','المجموعات الخاصة'],['Schools','Universities','Youth centers','Organizations','Companies','Private groups']],t=[['تنظيم المشاعر','إدارة الضغوط','مهارات التواصل','العلاقات الصحية','الوعي بالذات','التعلّق','الحدود','تقدير الذات','مهارات المراهقين','المهارات الاجتماعية','الضغوط الدراسية','المهارات الحياتية','برامج إبداعية'],['Emotional regulation','Stress management','Communication skills','Healthy relationships','Self-awareness','Attachment','Boundaries','Self-esteem','Teen skills','Social skills','Study pressure','Life skills','Creative programs']],i=L=='ar'?0:1,w=S[S.length-1];return `<section class="sec"><div class="w"><h1>${tr('الورش والبرامج','Workshops & Programs')}</h1><img class="pb" style="object-position:50% 50%" src="${IMG.t}" alt="${tr('ملاذ السكينة — طاولة ورشة فنية','Malath Al-Sakina — an art workshop table')}" loading="lazy"><div class="gal">${[['k','لوحات من ورشة رسم','paintings from a workshop'],['p','رسم باليد','painting by hand'],['h','قطعة جبسية ملونة','a painted plaster piece']].map(g=>`<img src="${IMG[g[0]]}" alt="${tr('ملاذ السكينة — '+g[1],'Malath Al-Sakina — '+g[2])}" loading="lazy">`).join('')}</div><p class="sub">${tr('ورش وبرامج تفاعلية موجهة إلى:','Interactive workshops and programs for:')}</p><ul class="chips">${u[i].map(x=>`<li>${x}</li>`).join('')}</ul><h2>${tr('الموضوعات','Topics')}</h2><ul class="chips">${t[i].map(x=>`<li>${x}</li>`).join('')}</ul></div></section><section class="band"><div class="w"><p class="stat">${tr('+130','130+')}</p><h2>${tr('مشاركًا في ورش تفاعلية','Participants in interactive workshops')}</h2><p class="note">${w[L=='ar'?'a':'e'][2]}</p><a class="btn" style="background:var(--onp);color:var(--plum)" href="#/book/workshop">${tr('اطلبي عرضًا','Request a Quote')}</a></div></section>`},
space:()=>`<section class="sec"><div class="w"><h1>${tr('مساحتك','Your Space')}</h1><p class="sub">${tr('محتوى مجاني للفهم والعناية بالنفس: مقالات قصيرة، تمارين عملية، وأوراق عمل عن المشاعر والعلاقات والحدود والحياة الأسرية.','Free content for understanding and self-care: short articles, practical exercises and worksheets on feelings, relationships, boundaries and family life.')}</p><div class="br" style="margin:24px 0;padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--card)"><div><h2>${tr('لحظة هدوء','A quiet moment')}</h2><p class="sub">${tr('ثلاثون ثانية لتتنفسي ببطء. لا شيء تثبتينه ولا شيء تتعلمينه.','Thirty seconds to breathe slowly. Nothing to prove, nothing to learn.')}</p><button class="btn" id="bt" data-breathe>${tr('ابدئي','Begin')}</button></div><div class="bf" id="bf" aria-hidden="true"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="52" fill="#D8D0C4"/><circle cx="70" cy="70" r="28" fill="#B89A6A" opacity=".85"/></svg></div><p class="bm" id="bm" aria-live="polite"></p></div><div class="card"><h3>${tr('المواد قيد الإعداد','Content is on its way')}</h3><p>${tr('ستظهر هنا المقالات والتمارين عند نشرها. في الأثناء، يمكنك استكشاف الجلسات.','Articles and exercises will appear here once published. Meanwhile, explore the sessions.')}</p><a class="btn" href="#/sessions">${tr('اكتشفي الجلسات','Explore Sessions')}</a></div></div></section>`,
about:()=>{const t=tr('أسماء سالم المشيخي أخصائية اجتماعية ومدربة معتمدة، تجمع في عملها بين الدعم الإنساني، الأدوات العملية، التدريب والتجارب التفاعلية. لديها خبرة في العمل مع الطالبات والأسر، متابعة الحالات الاجتماعية، تقديم الجلسات الفردية، وتيسير الورش والبرامج. كما يشمل تطويرها المهني شهادة Creating Behavioral Change المقدمة من Wesleyan University. تؤمن بأن التغيير لا يبدأ دائمًا من خطوة كبيرة، بل أحيانًا من مساحة آمنة للفهم، أو مهارة جديدة، أو تجربة تعيد الإنسان إلى نفسه.','Asma Salim Al-Mashikhi is a social work professional and certified trainer who brings together human support, practical tools, training and interactive experiences. She has experience working with students and families, following social cases, delivering individual sessions, and facilitating workshops and programs. Her professional development also includes Creating Behavioral Change from Wesleyan University. She believes change doesn’t always start with a big step; sometimes it starts with a safe space to understand, a new skill, or an experience that brings a person back to themselves.'),k=tr('تؤمن بأن','She believes'),i=t.indexOf(k),b=t.slice(0,i).trim(),q=t.slice(i+k.length).trim();return `<section class="sec"><div class="w fm"><h1>${tr('عن أسماء','About Asma')}</h1><img class="pb" style="object-position:50% 40%" src="${IMG.k}" alt="${tr('ملاذ السكينة — لوحات من ورشة رسم','Malath Al-Sakina — paintings from a workshop')}" loading="lazy"><p>${b}</p><blockquote class="q">“${q.charAt(0).toUpperCase()+q.slice(1)}”</blockquote><h2>${tr('المؤهلات والتطوير المهني','Credentials & Professional Development')}</h2><ul class="cred">${[['بكالوريوس الخدمة الاجتماعية','Bachelor’s Degree in Social Work'],['مدربة معتمدة من وزارة التعليم العالي','Certified Trainer, Ministry of Higher Education'],['مدربة معتمدة دوليًا','Certified International Trainer'],['Creating Behavioral Change — Wesleyan University','Creating Behavioral Change — Wesleyan University']].map(c=>`<li>${tr(c[0],c[1])}</li>`).join('')}</ul></div></section>`},
privacy:()=>`<section class="sec"><div class="w fm"><h1>${tr('سياسة الخصوصية','Privacy Policy')}</h1><p>${tr('المعلومات التي تشاركينها أثناء طلب الحجز تُعامل بسرية، ولا تُستخدم إلا للتواصل معك وتقديم الخدمة وفق الأنظمة المعمول بها.','Information you share when requesting a booking is handled confidentially and used only to contact you and deliver the service, in line with applicable regulations.')}</p><p>${tr('هذا الموقع لا يحفظ بيانات نموذج الحجز. عند الضغط على «متابعة الحجز عبر واتساب» تُفتح رسالة جاهزة في تطبيق واتساب وترسلينها بنفسك، فيخضع إرسالها لشروط واتساب.','This site does not store the booking form data. When you press “Continue via WhatsApp”, a ready message opens in the WhatsApp app and you send it yourself, so its delivery is subject to WhatsApp’s own terms.')}</p></div></section>`,

<script>
(function(){
  function fix(u){
    var m = String(u).match(/wa\.me\/(\d+)\/?(?:\?text=([^&#]*))?/);
    if(!m) return null;
    var t = m[2] ? '&text=' + m[2] : '';
    return {
      app: 'whatsapp://send?phone=' + m[1] + t,
      web: 'https://api.whatsapp.com/send?phone=' + m[1] + t
    };
  }
  function go(l){
    location.href = l.app;
    setTimeout(function(){ if(!document.hidden) location.href = l.web; }, 1500);
  }
  var o = window.open;
  window.open = function(u){
    var l = fix(u);
    if(l){ go(l); return window; }
    return o.apply(window, arguments);
  };
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href*="wa.me"]');
    if(!a) return;
    var l = fix(a.href);
    if(!l) return;
    e.preventDefault(); e.stopPropagation(); go(l);
  }, true);
})();
</script>
